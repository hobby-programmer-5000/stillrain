<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stillrain · 머문 비</title>
<meta name="description" content="Stillrain: a valley where rain hangs in the air until a sound lets it fall. An anime short drawn live in three.js, every mesh, texture and note made by code.">
<meta name="theme-color" content="#0d1b2a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='14' r='9' fill='%23bfe6f2'/%3E%3Ccircle cx='13' cy='11' r='2.4' fill='%23ffffff'/%3E%3Cpath d='M16 23v6' stroke='%2373a8c8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#0d1b2a;overflow:hidden;overscroll-behavior:none}
#film{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:default}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 28%,#2c5f86 0%,#173452 52%,#0d1b2a 100%);color:#e9f4f7;font:500 13px/1.5 "Iowan Old Style",Georgia,"Noto Serif KR","Batang",serif;letter-spacing:.06em;transition:opacity 1s;z-index:5;cursor:default;-webkit-user-select:none;user-select:none}
#ld i{font-style:normal;font-size:12px;letter-spacing:.55em;opacity:.75}
#ld b{font-size:46px;font-weight:500;letter-spacing:.16em;margin:6px 0 2px}
#ld em{font-style:italic;opacity:.7;font-size:12px}
#drops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#drops s{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#bfe6f2 30%,rgba(120,180,210,.35) 70%,transparent 72%);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#bar{width:220px;height:2px;background:rgba(233,244,247,.16);margin:26px 0 12px;position:relative}#bar s{position:absolute;left:0;top:0;height:2px;width:0;background:#ffd98a;transition:width .3s}
#st{font:500 11px/1 system-ui,sans-serif;opacity:.65;letter-spacing:.12em}
#ld.ready{cursor:pointer}#ld.ready #st{opacity:1;color:#ffe2a8;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
#hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font:600 11px/1.2 system-ui,sans-serif;letter-spacing:.04em;color:#eef7f8;background:rgba(10,26,40,.55);backdrop-filter:blur(6px);padding:9px 14px;border-radius:999px;transition:opacity .8s;opacity:0;pointer-events:none;z-index:4;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:#e9f4f7;font:18px Georgia,serif}
</style>
</head>
<body>
<canvas id="film" role="img" aria-label="Stillrain, an animated film. A valley where rain hangs in the air until a sound lets it fall."></canvas>
<div id="ld" role="button" tabindex="0" aria-describedby="keys"><div id="drops"></div><i>STILLRAIN</i><b>머문 비</b><em>the valley where rain waits for a sound</em><div id="bar"><s></s></div><div id="st">골짜기를 짓는 중</div></div>
<div id="hud"></div>
<p id="keys" class="sr">Space pauses and plays. Left and right arrows move between shots. R starts again, F fills the screen, M mutes, H hides hints, 2 switches drawings on twos.</p>
<noscript>This film needs JavaScript and WebGL 2.</noscript>

</body>
</html>
